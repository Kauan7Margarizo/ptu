
      <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador Estudantil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Planner Estudantil</h1>
    <div class="form-group">
      <input type="text" id="taskInput" placeholder="Descrição da tarefa...">
      <select id="taskCategory">
        <option value="escolar">Escolar / Acadêmica</option>
        <option value="dia-a-dia">Dia a Dia / Pessoal</option>
      </select>
      <input type="date" id="taskDate">
      <button onclick="addTask()">Adicionar Tarefa</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filterTasks('all', this)">Todas</button>
      <button class="filter-btn" onclick="filterTasks('escolar', this)">Escolares</button>
      <button class="filter-btn" onclick="filterTasks('dia-a-dia', this)">Dia a Dia</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
